name: tafsir
description: "Azan.ru's Tafsir."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.1.0+39

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  flutter_html: ^3.0.0
  scrollable_positioned_list: ^0.3.8
  csv: ^8.0.0
  fpdart: ^1.2.0
  sqflite: ^2.4.3
  json_annotation: ^4.12.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.0
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  ios: true
  android: true
  min_sdk_android: 24
  remove_alpha_ios: true
  image_path: design/logo-blue.png

flutter:
  uses-material-design: true

  assets:
    - assets/quran/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: KFGQPC Uthman Taha Naskh
      fonts:
        - asset: assets/fonts/KFGQPC-Uthman-Taha-Naskh-Regular.ttf
    - family: Me Quran
      fonts:
        - asset: assets/fonts/Me-Quran.ttf
    - family: Noorehira
      fonts:
        - asset: assets/fonts/Noorehira-Regular.ttf
    - family: PDMS Saleem
      fonts:
        - asset: assets/fonts/PDMS-Saleem-QuranFont-Regular.ttf
    - family: Scheherazade
      fonts:
        - asset: assets/fonts/Scheherazade-Regular.ttf
    - family: Sheikh Hamdullah
      fonts:
        - asset: assets/fonts/Shaikh-Hamdullah-Mushaf.ttf
